<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 2rem;
    }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    p { color: #94a3b8; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.9rem; }
    input[type="text"] {
      width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 6px;
      background: #0f172a; color: #f8fafc; font-size: 1rem;
    }
    input[type="text"]:focus { outline: none; border-color: #38bdf8; }
    button {
      background: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.5rem;
      border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem;
    }
    button:hover { background: #7dd3fc; }
    .task-list { margin-top: 1.5rem; }
    .task-item {
      background: #1e293b; border: 1px solid #334155; border-radius: 6px;
      padding: 1rem; margin-bottom: 0.75rem; display: flex;
      justify-content: space-between; align-items: center;
    }
    .task-info { flex: 1; }
    .task-title { font-weight: 600; margin-bottom: 0.25rem; }
    .task-meta { font-size: 0.8rem; color: #94a3b8; }
    .task-actions { display: flex; gap: 0.5rem; }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-delete:hover { background: #dc2626; }
    .btn-toggle { background: #10b981; color: white; }
    .btn-toggle:hover { background: #059669; }
    .completed .task-title { text-decoration: line-through; color: #64748b; }
    .empty-state { text-align: center; color: #94a3b8; padding: 2rem; }
    .error { color: #ef4444; text-align: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Task Manager</h1>
      <p>Manage your tasks with the Task API</p>
    </header>

    <div class="card">
      <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">Add New Task</h2>
      <form id="taskForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="taskTitle">Task Name</label>
          <input type="text" id="taskTitle" placeholder="Enter task name..." required>
        </div>
        <button type="submit">Add Task</button>
      </form>
    </div>

    <div class="task-list" id="taskList"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <p>No tasks yet. Add your first task above!</p>
    </div>

    <div id="errorMsg" class="error"></div>
  </div>

  <script>
    // Empty means "the same server that served this page", so any port works.
    const API_BASE = '';
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    const errorMsg = document.getElementById('errorMsg');
    const taskTitle = document.getElementById('taskTitle');

    // Ask the API for all tasks and show them.
    async function fetchTasks() {
      try {
        const response = await fetch(`${API_BASE}/tasks`);
        const tasks = await response.json();
        renderTasks(tasks);
      } catch (err) {
        errorMsg.textContent = 'Failed to load tasks. Make sure the server is running.';
      }
    }

    // Send a new task to the API.
    async function handleSubmit(e) {
      e.preventDefault();
      const title = taskTitle.value.trim();
      if (!title) return;
      try {
        await fetch(`${API_BASE}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, completed: false })
        });
        taskTitle.value = '';
        fetchTasks();
      } catch (err) {
        errorMsg.textContent = 'Failed to create task.';
      }
    }

    // Flip a task between done and not done.
    async function toggleTask(id, currentStatus) {
      try {
        await fetch(`${API_BASE}/tasks/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: !currentStatus })
        });
        fetchTasks();
      } catch (err) {
        errorMsg.textContent = 'Failed to update task.';
      }
    }

    // Delete a task after asking first.
    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE' });
        fetchTasks();
      } catch (err) {
        errorMsg.textContent = 'Failed to delete task.';
      }
    }

    // Draw the tasks on the page.
    function renderTasks(tasks) {
      taskList.innerHTML = '';
      errorMsg.textContent = '';

      if (tasks.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-item ${task.completed ? 'completed' : ''}`;
        div.innerHTML = `
          <div class="task-info">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-meta">ID: ${task.id} • ${new Date(task.created_at).toLocaleDateString()}</div>
          </div>
          <div class="task-actions">
            <button class="btn-small btn-toggle" onclick="toggleTask(${task.id}, ${task.completed})">
              ${task.completed ? 'Undo' : 'Complete'}
            </button>
            <button class="btn-small btn-delete" onclick="deleteTask(${task.id})">Delete</button>
          </div>
        `;
        taskList.appendChild(div);
      });
    }

    // Stop a task title from being treated as HTML (prevents XSS).
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    fetchTasks();
  </script>
</body>
</html>
